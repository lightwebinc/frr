!
hostname r1
!
debug zebra rib
debug zebra dplane
!
interface r1-eth0
 ipv6 address 2001:db8:1::1/64
!
ipv6 prefix-list STAYS-GONE seq 5 permit 2001:db8:98::/64
!
route-map SETSRC6 permit 5
 match ipv6 address prefix-list STAYS-GONE
 set src 2001:db8:51::1
!
route-map SETSRC6 permit 10
 set src 2001:db8:50::1
!
ipv6 protocol static route-map SETSRC6
!
